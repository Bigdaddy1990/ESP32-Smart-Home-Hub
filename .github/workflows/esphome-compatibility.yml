name: ESPHome OTA Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ["espsmarthomehub,yaml", "espsmarthomehub-encrypted-ota.yaml"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade esphome
      - name: Prepare isolated build with synthetic secrets
        run: |
          mkdir -p "$RUNNER_TEMP/hub-build"
          cp espsmarthomehub,yaml espsmarthomehub-encrypted-ota.yaml "$RUNNER_TEMP/hub-build/"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          import yaml
          secrets = {
              "wifi_ssid": "test-network",
              "wifi_password": "test-password",
              "ota_password": "test-ota-password",
              "api_encryption_key": base64.b64encode(bytes(range(32))).decode(),
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "hub-build"
          (root / "secrets.yaml").write_text(yaml.safe_dump(secrets))
          PY
      - name: Validate and compile firmware without uploading
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          cd "$RUNNER_TEMP/hub-build"
          esphome config "$CONFIGURATION" > resolved.yaml
          cat resolved.yaml
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          # BaseLoader retains secret references as scalar values without
          # resolving them or requiring a constructor for ESPHome YAML tags.
          config = yaml.load(Path("resolved.yaml").read_text(), Loader=yaml.BaseLoader)
          platforms = {entry["platform"] for entry in config["ota"]}
          native = next(entry for entry in config["ota"] if entry["platform"] == "esphome")
          if os.environ["CONFIGURATION"] == "espsmarthomehub-encrypted-ota.yaml":
              assert platforms == {"esphome"}, "Plaintext OTA platform restored"
              assert "captive_portal" not in config, "Captive portal restores Web OTA"
              assert config["web_server"]["ota"] == "false", "HTTP updates must be disabled"
              assert "password" not in native, "Encrypted stage retains OTA password"
              assert native["encryption"]["key"] == config["api"]["encryption"]["key"]
          else:
              assert platforms == {"esphome", "web_server"}, "Password bridge changed"
              assert native.get("password"), "Password bridge authentication missing"
          print("OTA stage isolation verified")
          PY
          esphome compile "$CONFIGURATION"
