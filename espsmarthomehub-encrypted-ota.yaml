# Use only after the hub has successfully booted ESPHome 2026.9.1 or newer.
packages:
  hub: !include espsmarthomehub,yaml

esphome:
  min_version: 2026.9.1

# Replace the password bridge with encrypted OTA using the API encryption key.
ota:
  - id: !extend hub_ota
    password: !remove
    encryption:
  - id: !remove hub_web_ota

# captive_portal auto-loads ota.web_server even after the explicit platform
# was removed above. No fallback AP exists in the included hub configuration.
captive_portal: !remove

# Keep the status web UI, but never accept firmware through plaintext HTTP.
web_server:
  ota: false
